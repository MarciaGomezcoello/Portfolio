<!DOCTYPE html>
<html lang="es">
  <head>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdfaf6" />
    <meta
      name="description"
      content="Sitio de la Dra. Marcia Gomezcoello — médica, escritora, poeta y tejedora. Libros, poemas, tejidos y las Tardes Literarias y Artísticas."
    />
    <meta property="og:title" content="Marcia Gomezcoello" />
    <meta
      property="og:description"
      content="Médica, escritora, poeta y tejedora — de Azogues a Nueva York."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png?v=2" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=2" />
    <title>Marcia Gomezcoello — escritora, poeta y tejedora</title>
  </head>

  </body>
</html>
